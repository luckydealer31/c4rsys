# PROPOSAL: the CI service is not chosen yet (O12). This workflow works if the repository is
# hosted on GitHub; on another host the same steps are repeated by scripts/check.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_DB: c4rsys
          POSTGRES_USER: c4rsys
          POSTGRES_PASSWORD: c4rsys_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U c4rsys -d c4rsys"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://c4rsys:c4rsys_ci@localhost:5432/c4rsys
      DJANGO_DEBUG: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Decision В-8.1: the tests of inspection videos run ffprobe and ffmpeg.
      # On 11.11.2026 the package mirror of the runner hung this step for an hour and stopped six
      # runs. Each try is now cut after 3 minutes and a silent connection after 20 seconds.
      - timeout-minutes: 12
        run: |
          apt="sudo timeout 180 apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2"
          for attempt in 1 2 3; do
            $apt update && $apt install -y --no-install-recommends ffmpeg && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          ffmpeg -version | head -1 && ffprobe -version | head -1
      - run: pip install -r requirements-dev.txt -c requirements.lock
      # Audit item 9: known vulnerabilities of the fixed versions stop the check.
      - run: pip install pip-audit && pip-audit -r requirements.lock --progress-spinner off
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # T19: the base example in a browser and the restart check (acceptance criteria 1 and 8).
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/e2e.sh 2>&1 | tee e2e-dev.log
      # T20: the same scenario on the test server build (Caddy, gunicorn, DEBUG off).
      - run: ./scripts/e2e.sh prod 2>&1 | tee e2e-prod.log
      # The failure text as a public annotation: job logs need a signed-in account.
      - if: failure()
        run: |
          for log in e2e-dev.log e2e-prod.log; do
            [ -f "$log" ] || continue
            text=$(grep -n -A25 -E "✘|Error|error:|exited with code" "$log" | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$text" ] && echo "::error title=$log::$text"
          done
          true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  # Audit items 25 and 47: the images of the server are built here, once per commit, and published
  # as ghcr.io/<owner>/c4rsys-backend|web:<commit>. The server only downloads them (no build, no
  # Docker Hub limits on the server), and any earlier commit can be put back by its tag.
  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The web image is tagged by the content of frontend/ (its git tree) and built only when that
      # content is new: a deploy that does not change the interface keeps Caddy running (item 47).
      - id: tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/c4rsys-${{ matrix.name }}"
          if [ "${{ matrix.name }}" = web ]; then
            tag="tree-$(git rev-parse HEAD:frontend)"
            if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            tag="${{ github.sha }}"
          fi
          echo "tags=$image:$tag" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.prod
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
