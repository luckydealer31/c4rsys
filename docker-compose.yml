# Local development and initial single-server run (A11). Not a cross-site failover mechanism.
name: c4rsys

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-c4rsys}
      POSTGRES_USER: ${POSTGRES_USER:-c4rsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c4rsys_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-c4rsys}:${POSTGRES_PASSWORD:-c4rsys_dev_only}@db:5432/${POSTGRES_DB:-c4rsys}
      DJANGO_DEBUG: "1"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      # Whole frontend folder, so config changes apply without rebuilding;
      # node_modules stays inside the container.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
