# Test server of stage 1 (T20): one server, Docker Compose (A11). Settings and secrets come
# from .env.prod next to this file (template: deploy/env.prod.example); it is never committed.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: c4rsys-test

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: c4rsys
      POSTGRES_USER: c4rsys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c4rsys -d c4rsys"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Audit item 38: the application role without superuser rights (deploy/db-app-role.sql).
  db-role:
    image: postgres:18.6
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: c4rsys
      PGDATABASE: c4rsys
      PGPASSWORD: ${POSTGRES_PASSWORD}
      C4R_DB_APP_PASSWORD: ${C4R_DB_APP_PASSWORD:?set C4R_DB_APP_PASSWORD in .env.prod}
    volumes:
      - ./deploy/db-app-role.sql:/db-app-role.sql:ro
    command: psql -X -q -f /db-app-role.sql
    depends_on:
      db:
        condition: service_healthy

  backend:
    # Audit item 25: the image built by CI for the commit (scripts/deploy.sh); `build` stays for
    # the local check of this build (scripts/e2e.sh prod).
    image: ${C4R_IMAGES:-ghcr.io/luckydealer31}/c4rsys-backend:${C4R_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: postgres://c4rsys_app:${C4R_DB_APP_PASSWORD}@db:5432/c4rsys
      # The superuser password stays with the database (audit item 38).
      POSTGRES_PASSWORD: ""
      DJANGO_DEBUG: "0"
      C4R_RELEASE: ${C4R_RELEASE:-}
      # Audit item 20 (PROPOSAL): queries and idle transactions are stopped after 60 s.
      C4R_DB_STATEMENT_TIMEOUT_MS: ${C4R_DB_STATEMENT_TIMEOUT_MS:-60000}
      C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS: ${C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
      C4R_FILES_ROOT: /data/files
      # Reached only through Caddy (port 8000 is not published): the visitor's address is the
      # last entry of X-Forwarded-For (audit item 37).
      C4R_TRUST_PROXY: "1"
    volumes:
      # Uploaded files (A10): kept apart from the database, back up together with it.
      - files_data:/data/files
    depends_on:
      db-role:
        condition: service_completed_successfully

  # Reference exchange rates (§ 17.1.6): downloaded at start and every 3 hours. A failed download
  # keeps the last rates; operations then show their age and a warning (§ 17.1.8).
  rates:
    # Audit item 25: the image built by CI for the commit (scripts/deploy.sh); `build` stays for
    # the local check of this build (scripts/e2e.sh prod).
    image: ${C4R_IMAGES:-ghcr.io/luckydealer31}/c4rsys-backend:${C4R_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: postgres://c4rsys_app:${C4R_DB_APP_PASSWORD}@db:5432/c4rsys
      # The superuser password stays with the database (audit item 38).
      POSTGRES_PASSWORD: ""
      DJANGO_DEBUG: "0"
      C4R_RELEASE: ${C4R_RELEASE:-}
      # Audit item 20 (PROPOSAL): queries and idle transactions are stopped after 60 s.
      C4R_DB_STATEMENT_TIMEOUT_MS: ${C4R_DB_STATEMENT_TIMEOUT_MS:-60000}
      C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS: ${C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
    command: sh -c "while true; do python manage.py fetch_exchange_rates; sleep 10800; done"
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  # Every 10 minutes: deposits whose hold term has passed go to the clients' balances (§ 14.7.1);
  # bookings whose auto-cancel moment at no-show has passed are cancelled (§ 14.8.1).
  deposits:
    # Audit item 25: the image built by CI for the commit (scripts/deploy.sh); `build` stays for
    # the local check of this build (scripts/e2e.sh prod).
    image: ${C4R_IMAGES:-ghcr.io/luckydealer31}/c4rsys-backend:${C4R_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: postgres://c4rsys_app:${C4R_DB_APP_PASSWORD}@db:5432/c4rsys
      # The superuser password stays with the database (audit item 38).
      POSTGRES_PASSWORD: ""
      DJANGO_DEBUG: "0"
      C4R_RELEASE: ${C4R_RELEASE:-}
      # Audit item 20 (PROPOSAL): queries and idle transactions are stopped after 60 s.
      C4R_DB_STATEMENT_TIMEOUT_MS: ${C4R_DB_STATEMENT_TIMEOUT_MS:-60000}
      C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS: ${C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
    command: sh -c "while true; do python manage.py release_deposits; python manage.py cancel_no_shows; sleep 600; done"
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  # Every 5 minutes (decision З-5): repetitions of repeating tasks whose date has come
  # (§ 19.4.1); deadlines, reminders and warnings of the notification centre (гл. 20).
  schedule:
    # Audit item 25: the image built by CI for the commit (scripts/deploy.sh); `build` stays for
    # the local check of this build (scripts/e2e.sh prod).
    image: ${C4R_IMAGES:-ghcr.io/luckydealer31}/c4rsys-backend:${C4R_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: postgres://c4rsys_app:${C4R_DB_APP_PASSWORD}@db:5432/c4rsys
      # The superuser password stays with the database (audit item 38).
      POSTGRES_PASSWORD: ""
      DJANGO_DEBUG: "0"
      C4R_RELEASE: ${C4R_RELEASE:-}
      # Audit item 20 (PROPOSAL): queries and idle transactions are stopped after 60 s.
      C4R_DB_STATEMENT_TIMEOUT_MS: ${C4R_DB_STATEMENT_TIMEOUT_MS:-60000}
      C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS: ${C4R_DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
      C4R_FILES_ROOT: /data/files
    volumes:
      - files_data:/data/files
    # Decision В-8.1: inspection videos whose compression was interrupted are compressed again;
    # the files volume is shared with the backend for that (and for the removal of imports).
    command: sh -c "while true; do python manage.py run_task_schedule; python manage.py run_notifications; python manage.py remove_import_files; python manage.py process_videos; sleep 300; done"
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  web:
    image: ${C4R_IMAGES:-ghcr.io/luckydealer31}/c4rsys-web:${C4R_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      C4R_SITE_ADDRESS: ${C4R_SITE_ADDRESS:-:80}
    # Audit item 38: Caddy runs as the user caddy, not root; ports 80 and 443 open to it through the
    # network namespace setting of this container only. The image marks /usr/bin/caddy with
    # cap_net_bind_service, so that one capability stays in the set or the binary does not start.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${C4R_HTTP_BIND:-80}:80"
      - "${C4R_HTTPS_BIND:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  files_data:
  caddy_data:
  caddy_config:
