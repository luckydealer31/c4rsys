# Local check of the test server build (./scripts/e2e.sh prod): no published ports, HTTPS inside
# the network as on the server (audit item 45: Safari keeps no Secure cookie over plain HTTP, and
# the build sets the CSRF cookie Secure), codes in the log so the browser test can read them.
services:
  backend:
    environment:
      DJANGO_SECRET_KEY: local-check-only-not-a-secret
      # cabinet.localhost: the personal cabinet in the browser test (C4R_CABINET_HOSTS default).
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,cabinet.localhost
      C4R_CABINET_HOSTS: cabinet.localhost
      C4R_MAIL_MODE: console
      C4R_ALLOW_CONSOLE_MAIL: "1"
  web:
    environment:
      # Caddy issues certificates of its own local authority for *.localhost names.
      C4R_SITE_ADDRESS: "localhost, cabinet.localhost"
    ports: !reset []
  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: ["e2e"]
    network_mode: "service:web"
    working_dir: /e2e
    environment:
      COMPOSE_PROJECT: c4rsys-prodcheck
      BASE_URL: https://localhost
      # The build has the service worker: the offline scenario also reloads without connection.
      C4R_BUILD: prod
      CI: ${CI:-}
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
      - ./frontend/src/i18n/locales:/locales:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
